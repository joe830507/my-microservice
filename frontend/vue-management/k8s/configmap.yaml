apiVersion: v1
kind: ConfigMap
metadata:
  name: vue-management
data:
  # api-gateway 的 Service 名稱與埠（同一個 namespace 內用短名稱即可）
  API_GATEWAY_URL: "http://api-gateway:8080"
  # 商品圖片的來源（後端的 STORAGE_PUBLIC_BASE_URL）：後台的圖片是瀏覽器直接上傳到這裡，
  # CSP 的 img-src 與 connect-src 都會用到；正式環境換成 CDN／儲存網域時要跟著改
  STORAGE_PUBLIC_ORIGIN: "http://localhost:8333"
