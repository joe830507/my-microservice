# 由 generate_dashboard.py 產生，不要手動改
{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "my-microservice",
      "folder": "my-microservice",
      "interval": "1m",
      "rules": [
        {
          "uid": "mm-5xx-rate",
          "title": "服務 5xx 錯誤率偏高",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "{{ $labels.service_name }} 的 5xx 超過 5%（持續 5 分鐘）"
          },
          "labels": {
            "severity": "critical"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 900,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum by (service_name) (rate(http_server_requests_milliseconds_count{uri!~\"/actuator.*\",status=~\"5..\"}[5m])) / sum by (service_name) (rate(http_server_requests_milliseconds_count{uri!~\"/actuator.*\"}[5m]))",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.05
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "mm-p95-latency",
          "title": "服務延遲偏高（p95 > 2 秒）",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "{{ $labels.service_name }} 的 p95 延遲超過 2 秒（持續 5 分鐘）"
          },
          "labels": {
            "severity": "warning"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 900,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(http_server_requests_milliseconds_bucket{uri!~\"/actuator.*\"}[5m])))",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        2000
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "mm-scheduled-job-failed",
          "title": "排程執行失敗",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "{{ $labels.service_name }} 的排程失敗（見 log）"
          },
          "labels": {
            "severity": "warning"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 900,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum by (service_name, code_namespace) (increase(tasks_scheduled_execution_milliseconds_count{outcome!=\"SUCCESS\"}[10m]))",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "mm-no-metrics",
          "title": "服務沒有回報指標",
          "condition": "C",
          "for": "1m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "{{ $labels.service_name }} 超過 2 分鐘沒有送指標（服務停了，或到 collector 的連線斷了）"
          },
          "labels": {
            "severity": "critical"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 900,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "time() - max by (service_name) (timestamp(process_cpu_usage))",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        120
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "mm-circuit-open",
          "title": "熔斷器打開",
          "condition": "C",
          "for": "1m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "{{ $labels.name }} 的熔斷器打開超過 1 分鐘：下游連不上或逾時，呼叫被直接拒絕"
          },
          "labels": {
            "severity": "critical"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 900,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max by (name) (resilience4j_circuitbreaker_state{state=\"open\"})",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "mm-replicas-low",
          "title": "副本數少於 2",
          "condition": "C",
          "for": "3m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "{{ $labels.service_name }} 的副本少於 2 個超過 3 分鐘（Pod 掛了或更新卡住）"
          },
          "labels": {
            "severity": "warning"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 900,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "count by (service_name) (count by (service_name, instance) (last_over_time(process_cpu_usage[1m])))",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        2
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "mm-reservation-rejected",
          "title": "預扣被拒偏多",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": {
            "summary": "10 分鐘內超過 20 次預扣被拒：庫存不足或被刷"
          },
          "labels": {
            "severity": "warning"
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 900,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(increase(reservations_total{result=\"rejected\"}[10m]))",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "last"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        20
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "mm-kafka-consumer-lag",
          "title": "Kafka consumer lag 偏高",
          "condition": "C",
          "for": "5m",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": { "summary": "{{ $labels.service }} 的 Kafka consumer lag 持續超過 1000 筆" },
          "labels": { "severity": "warning" },
          "data": [
            { "refId": "A", "relativeTimeRange": { "from": 900, "to": 0 }, "datasourceUid": "prometheus", "model": { "refId": "A", "expr": "max by (service) (kafka_consumer_records_lag_max)", "instant": true, "intervalMs": 1000, "maxDataPoints": 43200 } },
            { "refId": "B", "datasourceUid": "__expr__", "model": { "refId": "B", "type": "reduce", "expression": "A", "reducer": "last" } },
            { "refId": "C", "datasourceUid": "__expr__", "model": { "refId": "C", "type": "threshold", "expression": "B", "conditions": [{ "evaluator": { "type": "gt", "params": [1000] } }] } }
          ]
        },
        {
          "uid": "mm-kafka-dlt",
          "title": "Kafka 事件進入 DLT",
          "condition": "C",
          "for": "0s",
          "noDataState": "OK",
          "execErrState": "Error",
          "annotations": { "summary": "事件進入 dead-letter topic；請檢查消費端錯誤" },
          "labels": { "severity": "critical" },
          "data": [
            { "refId": "A", "relativeTimeRange": { "from": 900, "to": 0 }, "datasourceUid": "prometheus", "model": { "refId": "A", "expr": "sum(increase(events_dlt_published_total[5m]))", "instant": true, "intervalMs": 1000, "maxDataPoints": 43200 } },
            { "refId": "B", "datasourceUid": "__expr__", "model": { "refId": "B", "type": "reduce", "expression": "A", "reducer": "last" } },
            { "refId": "C", "datasourceUid": "__expr__", "model": { "refId": "C", "type": "threshold", "expression": "B", "conditions": [{ "evaluator": { "type": "gt", "params": [0] } }] } }
          ]
        }
      ]
    }
  ]
}
