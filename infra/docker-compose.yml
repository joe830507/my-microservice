name: my-microservice

services:
  product-db:
    image: postgres:18.6
    container_name: my-microservice-product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 起資料目錄改為 /var/lib/postgresql/18/docker，掛載上層目錄
      - product-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  user-db:
    image: postgres:18.6
    container_name: my-microservice-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "5435:5432"
    volumes:
      # PostgreSQL 18 起資料目錄改為 /var/lib/postgresql/18/docker，掛載上層目錄
      - user-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  product-redis:
    image: redis:8.2
    container_name: my-microservice-product-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  product-db-data:
  user-db-data:
