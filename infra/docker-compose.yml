name: my-microservice

services:
  product-db:
    image: postgres:18.6
    container_name: my-microservice-product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 起資料目錄改為 /var/lib/postgresql/18/docker，掛載上層目錄
      - product-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  user-db:
    image: postgres:18.6
    container_name: my-microservice-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "5435:5432"
    volumes:
      # PostgreSQL 18 起資料目錄改為 /var/lib/postgresql/18/docker，掛載上層目錄
      - user-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  inventory-db:
    image: postgres:18.6
    container_name: my-microservice-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "5434:5432"
    volumes:
      # PostgreSQL 18 起資料目錄改為 /var/lib/postgresql/18/docker，掛載上層目錄
      - inventory-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  order-db:
    image: postgres:18.6
    container_name: my-microservice-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18 起資料目錄改為 /var/lib/postgresql/18/docker，掛載上層目錄
      - order-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  payment-db:
    image: postgres:18.6
    container_name: my-microservice-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "5436:5432"
    volumes:
      # PostgreSQL 18 起資料目錄改為 /var/lib/postgresql/18/docker，掛載上層目錄
      - payment-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  product-redis:
    image: redis:8.2
    container_name: my-microservice-product-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # user-service 的登入失敗計數；和 product 分開，資料不混用。只放短期計數，不需要持久化
  user-redis:
    image: redis:8.2
    container_name: my-microservice-user-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # api-gateway 依來源 IP 的登入限流（token bucket）；和其他服務分開。只放短期計數，不需要持久化
  gateway-redis:
    image: redis:8.2
    container_name: my-microservice-gateway-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  product-db-data:
  user-db-data:
  inventory-db-data:
  order-db-data:
  payment-db-data:
