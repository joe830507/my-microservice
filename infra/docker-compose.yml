name: my-microservice

# 本機開發用：資料庫與 Redis 的預設帳密（postgres / postgres、Redis 沒有密碼）只適用本機。
# 所有埠都綁在 127.0.0.1：不綁的話（"5432:5432"）會對同一個網路的所有人開放，任何人都能直接連進資料庫（SEC-03）。
# 正式環境不要用這份檔案，見 infra/k8s（密碼與金鑰由 Secret 隨機產生）。

services:
  product-db:
    image: postgres:18.6
    container_name: my-microservice-product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 起資料目錄改為 /var/lib/postgresql/18/docker，掛載上層目錄
      - product-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  user-db:
    image: postgres:18.6
    container_name: my-microservice-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      # PostgreSQL 18 起資料目錄改為 /var/lib/postgresql/18/docker，掛載上層目錄
      - user-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  inventory-db:
    image: postgres:18.6
    container_name: my-microservice-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # PostgreSQL 18 起資料目錄改為 /var/lib/postgresql/18/docker，掛載上層目錄
      - inventory-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  order-db:
    image: postgres:18.6
    container_name: my-microservice-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18 起資料目錄改為 /var/lib/postgresql/18/docker，掛載上層目錄
      - order-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  payment-db:
    image: postgres:18.6
    container_name: my-microservice-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      # PostgreSQL 18 起資料目錄改為 /var/lib/postgresql/18/docker，掛載上層目錄
      - payment-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  # 相容 S3 的物件儲存（商品圖片）；MinIO 已不提供免費映像，改用 SeaweedFS
  # 帳號與匿名讀取權限在 seaweedfs/s3.json：只有 products/ 開放匿名讀，tmp/ 私有
  object-storage:
    image: chrislusf/seaweedfs:3.80
    container_name: my-microservice-object-storage
    command: ["server", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json",
              "-dir=/data", "-ip=object-storage", "-ip.bind=0.0.0.0"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - object-storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
  # 建立 bucket、設定 tmp/ 一天後自動刪除（沒有登記的上傳檔案）；執行完就結束，重複執行沒關係
  object-storage-init:
    image: chrislusf/seaweedfs:3.80
    container_name: my-microservice-object-storage-init
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf 's3.bucket.create -name product-images\nfs.configure -locationPrefix=/buckets/product-images/tmp/ -ttl=1d -apply\n'
        | weed shell -master=object-storage:9333
  product-redis:
    image: redis:8.2
    container_name: my-microservice-product-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # user-service 的登入失敗計數；和 product 分開，資料不混用。只放短期計數，不需要持久化
  user-redis:
    image: redis:8.2
    container_name: my-microservice-user-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # api-gateway 依來源 IP 的登入限流（token bucket）；和其他服務分開。只放短期計數，不需要持久化
  gateway-redis:
    image: redis:8.2
    container_name: my-microservice-gateway-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # 可觀測性（階段 A）：OpenTelemetry Collector + Prometheus + Tempo + Loki + Grafana 在同一個容器（本機開發用）
  # 服務用 OTLP 送資料：OBSERVABILITY_EXPORT_ENABLED=true OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 再啟動服務
  # Grafana：http://localhost:3000（匿名可看；本機專用，因為埠只綁 127.0.0.1）
  observability:
    image: grafana/otel-lgtm:0.40.0
    container_name: my-microservice-observability
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - observability-data:/data
      # 儀表板：放進這個資料夾的 JSON 會自動載入（見 observability/dashboards/）
      - ./observability/dashboards:/otel-lgtm/dashboards:ro
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/my-microservice.yaml:ro
      # 告警規則（5xx、延遲、排程失敗、服務沒有回報、預扣被拒）
      - ./observability/alerting.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/my-microservice.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  # 階段 C：單節點 Kafka KRaft；供本機事件流程開發使用
  kafka:
    image: apache/kafka:4.1.0
    container_name: my-microservice-kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
  kafka-topics-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        for topic in payment.events order.events product.events user.events payment.events.DLT order.events.DLT product.events.DLT user.events.DLT; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1;
        done
    restart: "no"
volumes:
  observability-data:
  kafka-data:
  product-db-data:
  user-db-data:
  object-storage-data:
  inventory-db-data:
  order-db-data:
  payment-db-data:
