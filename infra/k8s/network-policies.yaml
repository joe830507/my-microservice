# object-storage 的 S3：只有 product-service（瀏覽器直傳與讀圖走對外的位址，不經過這裡）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-object-storage
spec:
  podSelector:
    matchLabels:
      app: object-storage
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: product-service
        - podSelector:
            matchLabels:
              app: object-storage-init
      ports:
        - protocol: TCP
          port: 8333
---
# object-storage 的 master、master gRPC、filer、filer gRPC：只有建立 bucket 的初始化 Job
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-object-storage-admin
spec:
  podSelector:
    matchLabels:
      app: object-storage
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: object-storage-init
      ports:
        - protocol: TCP
          port: 9333
        - protocol: TCP
          port: 19333
        - protocol: TCP
          port: 8888
        - protocol: TCP
          port: 18888
