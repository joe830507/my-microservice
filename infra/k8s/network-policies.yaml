# 網路隔離（SEC-02）：後端服務信任 Gateway 帶來的 X-User-Id、X-User-Roles，不驗 JWT，
# 所以「只有 Gateway 連得到服務」必須由網路強制。這份檔案先全部拒絕進入，再逐一開放需要的連線。
#
# 注意：NetworkPolicy 要 CNI 外掛實際執行才有效（kind 的 kindnet 在新版有支援；用 kubectl 的 dry-run 不會驗出來），
# 部署後要實際驗證：從沒有權限的 Pod 連服務應該逾時（見 docs/implementation-plans/backend-deployment/）。
# 這份只限制「進入」（Ingress）；出去（Egress）在 network-policies-egress.yaml。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# 前端（商店、後台）是對外入口：任何來源都可以連它的 8080。之後前面加 Ingress 時，可以改成只允許 Ingress 所在的 namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontends
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["vue-customer", "vue-management"]
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# Gateway 只接受前端 nginx 轉發過來的請求（nginx 會清掉用戶端自己帶的 X-User-* 並覆蓋 X-Forwarded-For）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-from-frontends
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: vue-customer
        - podSelector:
            matchLabels:
              app: vue-management
      ports:
        - protocol: TCP
          port: 8080
---
# user-service：Gateway 轉發登入、註冊，並抓 JWKS 驗證 JWT
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-user-service
spec:
  podSelector:
    matchLabels:
      app: user-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8084
---
# product-service：Gateway 轉發；order-service 建單時查商品
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-product-service
spec:
  podSelector:
    matchLabels:
      app: product-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - podSelector:
            matchLabels:
              app: order-service
      ports:
        - protocol: TCP
          port: 8081
---
# inventory-service：Gateway 轉發；order-service 預扣、確認、釋放庫存
