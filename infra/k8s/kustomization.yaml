apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 全部放進同一個 namespace（前端的 manifests 沒有寫 namespace，由這裡統一加上）
namespace: my-microservice
resources:
  - namespace.yaml
  - data/databases.yaml
  - data/redis.yaml
  - data/object-storage.yaml
  - data/kafka.yaml
  - data/elasticsearch.yaml
  - data/mailpit.yaml
  - services/user-service.yaml
  - services/product-service.yaml
  - services/inventory-service.yaml
  - services/order-service.yaml
  - services/payment-service.yaml
  - services/notification-service.yaml
  - services/api-gateway.yaml
  - services/pod-disruption-budgets.yaml
  - ../observability
  - ../../frontend/vue-customer/k8s
  - ../../frontend/vue-management/k8s
  - network-policies.yaml
  - network-policies-egress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: my-microservice
    includeSelectors: false
