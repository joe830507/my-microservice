apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  labels:
    app: inventory-service
spec:
  # ClusterIP：只在叢集內可連，進出由 NetworkPolicy 控制（見 network-policies.yaml）
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app: inventory-service
spec:
  # 只有 1 個副本：定時工作（逾時取消、預扣釋放、通知重試）沒有分散式鎖，多個副本會重複執行
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: inventory-service
          image: my-microservice/inventory-service:0.1.0
          # 本機 kind 用 kind load 載入映像檔；換成映像檔倉庫後改成 IfNotPresent 或 Always
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            # 可觀測性（階段 A）：指標、追蹤、log 用 OTLP 送到 observability
            - name: OBSERVABILITY_EXPORT_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://observability:4318
            - name: DEPLOYMENT_ENVIRONMENT
              value: kind
            # log 用結構化 JSON（observability 模組的 logback-spring.xml 裡的 json-logs profile）
            - name: SPRING_PROFILES_INCLUDE
              value: json-logs
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://inventory-db:5432/inventory_db
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: inventory-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-db
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # 唯讀根檔案系統：Tomcat 與 JVM 要寫的暫存目錄
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
