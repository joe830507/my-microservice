apiVersion: v1
kind: Service
metadata:
  name: product-service
  labels:
    app: product-service
spec:
  # ClusterIP：只在叢集內可連，進出由 NetworkPolicy 控制（見 network-policies.yaml）
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
spec:
  # 2 個副本（階段 B5）：定時工作用 ShedLock 保證每一輪只有一個副本執行；
  # 滾動更新時先起新的、就緒後才關舊的（maxUnavailable: 0），過程中不會少於 2 個
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      # 兩個副本盡量放在不同節點（kind 只有一個節點時無法分開，所以用 ScheduleAnyway 而不是 DoNotSchedule）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: product-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      # 要大於 preStop 的等待 + 優雅關閉的上限
      terminationGracePeriodSeconds: 40
      containers:
        - name: product-service
          image: my-microservice/product-service:0.1.0
          # 本機 kind 用 kind load 載入映像檔；換成映像檔倉庫後改成 IfNotPresent 或 Always
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              # Pod 被刪除時，Service 的端點移除和 SIGTERM 是同時發生的：先等幾秒，讓 kube-proxy／Gateway 停止把新請求送來，
              # 再開始關閉；不等的話滾動更新時會有少數請求打到正在關閉的 Pod
              exec:
                command: ["sleep", "8"]
          ports:
            - name: http
              containerPort: 8081
          env:
            # 優雅關閉（階段 B5）：收到 SIGTERM 後不再接新請求，把處理中的做完（最久 20 秒）
            - name: SERVER_SHUTDOWN
              value: graceful
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 20s
            # 可觀測性（階段 A）：指標、追蹤、log 用 OTLP 送到 observability
            - name: OBSERVABILITY_EXPORT_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://observability:4318
            - name: DEPLOYMENT_ENVIRONMENT
              value: kind
            # log 用結構化 JSON（observability 模組的 logback-spring.xml 裡的 json-logs profile）
            - name: SPRING_PROFILES_INCLUDE
              value: json-logs
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://product-db:5432/product_db
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: product-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-db
                  key: password
            - name: SPRING_DATA_REDIS_HOST
              value: product-redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-redis
                  key: password
            # 物件儲存：product-service 自己操作物件（叢集內部位址）
            - name: STORAGE_ENDPOINT
              value: http://object-storage:8333
            # 給瀏覽器直接上傳的簽章網址用對外位址：瀏覽器連不到叢集內部的 object-storage。
            # 簽章包含 Host，這個值要和瀏覽器實際連線的主機與埠一致（kind 驗證時用 port-forward 到 localhost:8333）
            - name: STORAGE_UPLOAD_ENDPOINT
              value: http://localhost:8333
            # 圖片的公開網址前綴（前台、後台的 <img> 與 CSP 的 img-src 都用它）
            - name: STORAGE_PUBLIC_BASE_URL
              value: http://localhost:8333/product-images
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage
                  key: access-key
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage
                  key: secret-key
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # 唯讀根檔案系統：Tomcat 與 JVM 要寫的暫存目錄
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
