# 唯一的對外入口：驗 JWT、轉發到各服務、登入限流
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  # ClusterIP：只在叢集內可連，進出由 NetworkPolicy 控制（見 network-policies.yaml）
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  # 2 個副本（階段 B5）：定時工作用 ShedLock 保證每一輪只有一個副本執行；
  # 滾動更新時先起新的、就緒後才關舊的（maxUnavailable: 0），過程中不會少於 2 個
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # 兩個副本盡量放在不同節點（kind 只有一個節點時無法分開，所以用 ScheduleAnyway 而不是 DoNotSchedule）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      # 要大於 preStop 的等待 + 優雅關閉的上限
      terminationGracePeriodSeconds: 40
      containers:
        - name: api-gateway
          image: my-microservice/api-gateway:0.1.0
          # 本機 kind 用 kind load 載入映像檔；換成映像檔倉庫後改成 IfNotPresent 或 Always
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              # Pod 被刪除時，Service 的端點移除和 SIGTERM 是同時發生的：先等幾秒，讓 kube-proxy／Gateway 停止把新請求送來，
              # 再開始關閉；不等的話滾動更新時會有少數請求打到正在關閉的 Pod
              exec:
                command: ["sleep", "8"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # 優雅關閉（階段 B5）：收到 SIGTERM 後不再接新請求，把處理中的做完（最久 20 秒）
            - name: SERVER_SHUTDOWN
              value: graceful
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 20s
            # 可觀測性（階段 A）：指標、追蹤、log 用 OTLP 送到 observability
            - name: OBSERVABILITY_EXPORT_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://observability:4318
            - name: DEPLOYMENT_ENVIRONMENT
              value: kind
            # log 用結構化 JSON（observability 模組的 logback-spring.xml 裡的 json-logs profile）
            - name: SPRING_PROFILES_INCLUDE
              value: json-logs
            - name: USER_SERVICE_URI
              value: http://user-service:8084
            - name: PRODUCT_SERVICE_URI
              value: http://product-service:8081
            - name: INVENTORY_SERVICE_URI
              value: http://inventory-service:8083
            - name: ORDER_SERVICE_URI
              value: http://order-service:8082
            - name: PAYMENT_SERVICE_URI
              value: http://payment-service:8085
            # 登入限流依來源 IP。Gateway 前面是前端的 nginx（1 層代理），它把 X-Forwarded-For 覆蓋成真實用戶端 IP；
            # 設成 1 才會取那個值。維持 0 的話 Gateway 看到的永遠是 nginx 的 Pod IP，所有使用者共用同一個限流額度
            # 前面如果再加 Ingress，這裡要改成 2（NetworkPolicy 只允許前端與 Ingress 連進來，所以信任這一層是安全的）
            - name: GATEWAY_TRUSTED_PROXIES
              value: "1"
            - name: GATEWAY_REDIS_HOST
              value: gateway-redis
            - name: GATEWAY_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-redis
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # 唯讀根檔案系統：Tomcat 與 JVM 要寫的暫存目錄
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
