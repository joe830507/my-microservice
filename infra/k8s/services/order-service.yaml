apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  # ClusterIP：只在叢集內可連，進出由 NetworkPolicy 控制（見 network-policies.yaml）
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  # 2 個副本（階段 B5）：定時工作用 ShedLock 保證每一輪只有一個副本執行；
  # 滾動更新時先起新的、就緒後才關舊的（maxUnavailable: 0），過程中不會少於 2 個
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      # 兩個副本盡量放在不同節點（kind 只有一個節點時無法分開，所以用 ScheduleAnyway 而不是 DoNotSchedule）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: order-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: order-service
          image: my-microservice/order-service:0.1.0
          # 本機 kind 用 kind load 載入映像檔；換成映像檔倉庫後改成 IfNotPresent 或 Always
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            # 可觀測性（階段 A）：指標、追蹤、log 用 OTLP 送到 observability
            - name: OBSERVABILITY_EXPORT_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://observability:4318
            - name: DEPLOYMENT_ENVIRONMENT
              value: kind
            # log 用結構化 JSON（observability 模組的 logback-spring.xml 裡的 json-logs profile）
            - name: SPRING_PROFILES_INCLUDE
              value: json-logs
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://order-db:5432/order_db
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: order-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-db
                  key: password
            - name: PRODUCT_SERVICE_URI
              value: http://product-service:8081
            - name: INVENTORY_SERVICE_URI
              value: http://inventory-service:8083
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # 唯讀根檔案系統：Tomcat 與 JVM 要寫的暫存目錄
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
