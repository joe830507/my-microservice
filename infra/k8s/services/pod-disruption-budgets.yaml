# 自願性中斷（節點維護、drain）時，每個服務至少保留 1 個副本在服務
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-service
  labels:
    app: inventory-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: inventory-service
