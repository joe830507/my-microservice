server:
  port: 8083

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5434/inventory_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    schemas: inventory_service
  jackson:
    deserialization:
      # 數量必須是整數：預設會把 1.5 默默轉成 1
      accept-float-as-int: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
app:
  # 每 5 分鐘釋放建立超過 1 小時仍是 RESERVED 的預扣（ReservationExpiryJob）
  # ttl 必須比 order-service 的付款期限（30 分鐘）長
  reservation-expiry:
    cron: "0 */5 * * * *"
    ttl: 1h
    batch-size: 100
