server:
  port: 8083

spring:
  application:
    name: inventory-service
  # 指標、追蹤、log 的共用設定（common 以外的 observability 模組，階段 A）
  config:
    import: classpath:observability.yml
  datasource:
    url: jdbc:postgresql://localhost:5434/inventory_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    schemas: inventory_service
  jackson:
    deserialization:
      # 數量必須是整數：預設會把 1.5 默默轉成 1
      accept-float-as-int: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
app:
  # 排程的分散式鎖（ShedLock，階段 B4）：鎖放在自己的 PostgreSQL；
  # at-least-for 要大於副本之間的時鐘差、小於 cron 的間隔（這裡所有排程至少相隔 15 秒以上）
  scheduling:
    lock:
      table: inventory_service.shedlock
      at-most-for: PT5M
      at-least-for: PT10S
  # 每 5 分鐘釋放建立超過 1 小時仍是 RESERVED 的預扣（ReservationExpiryJob）
  # ttl 必須比 order-service 的付款期限（30 分鐘）長
  reservation-expiry:
    cron: "0 */5 * * * *"
    ttl: 1h
    batch-size: 100

# API 文件（springdoc）：預設關閉（SEC-09）。Swagger UI 與 /v3/api-docs 會公開所有 API 的細節，只在本機開發用環境變數
# SPRINGDOC_ENABLED=true 開啟；Gateway 本來就不轉發這些路徑，所以對外也看不到
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
