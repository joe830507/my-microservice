server:
  port: 8085

# 下游服務的位置：本機預設 localhost:{port}；K8s 部署時用環境變數改成 Service 名稱
payment:
  # 模擬金流回呼（POST /payments/{id}/mock-callback）：預設關閉。開了之後顧客可以自己把付款標成成功，等於不用付錢
  # 只在本機開發、E2E、示範環境用環境變數 PAYMENT_MOCK_CALLBACK_ENABLED=true 開啟（SEC-01）
  mock-callback:
    enabled: ${PAYMENT_MOCK_CALLBACK_ENABLED:false}
  services:
    order-uri: ${ORDER_SERVICE_URI:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 5s

spring:
  application:
    name: payment-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      properties:
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 10000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  # 指標、追蹤、log 的共用設定（common 以外的 observability 模組，階段 A）
  config:
    import: classpath:observability.yml
  datasource:
    url: jdbc:postgresql://localhost:5436/payment_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    schemas: payment_service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
app:
  events:
    enabled: ${APP_EVENTS_ENABLED:true}
    schema: payment_service
  # 排程的分散式鎖（ShedLock，階段 B4）：鎖放在自己的 PostgreSQL；
  # at-least-for 要大於副本之間的時鐘差、小於 cron 的間隔（這裡所有排程至少相隔 15 秒以上）
  scheduling:
    lock:
      table: payment_service.shedlock
      at-most-for: PT5M
      at-least-for: PT10S
  # 每分鐘重試還沒通知 order-service 成功的付款（OrderNotificationRetryJob）
  order-notification-retry:
    cron: "15 * * * * *"
    min-age: 1m
    batch-size: 100

# API 文件（springdoc）：預設關閉（SEC-09）。Swagger UI 與 /v3/api-docs 會公開所有 API 的細節，只在本機開發用環境變數
# SPRINGDOC_ENABLED=true 開啟；Gateway 本來就不轉發這些路徑，所以對外也看不到
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
