server:
  port: 8085

# 下游服務的位置：本機預設 localhost:{port}；K8s 部署時用環境變數改成 Service 名稱
payment:
  # 模擬金流回呼（POST /payments/{id}/mock-callback）：預設關閉。開了之後顧客可以自己把付款標成成功，等於不用付錢
  # 只在本機開發、E2E、示範環境用環境變數 PAYMENT_MOCK_CALLBACK_ENABLED=true 開啟（SEC-01）
  mock-callback:
    enabled: ${PAYMENT_MOCK_CALLBACK_ENABLED:false}
  services:
    order-uri: ${ORDER_SERVICE_URI:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 5s

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5436/payment_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    schemas: payment_service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
app:
  # 每分鐘重試還沒通知 order-service 成功的付款（OrderNotificationRetryJob）
  order-notification-retry:
    cron: "15 * * * * *"
    min-age: 1m
    batch-size: 100

# API 文件（springdoc）：預設關閉（SEC-09）。Swagger UI 與 /v3/api-docs 會公開所有 API 的細節，只在本機開發用環境變數
# SPRINGDOC_ENABLED=true 開啟；Gateway 本來就不轉發這些路徑，所以對外也看不到
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
