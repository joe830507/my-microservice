server:
  port: 8086

spring:
  application:
    name: notification-service
  config:
    import: classpath:observability.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/notification_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    schemas: notification_service
    default-schema: notification_service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    admin:
      fail-fast: true
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      observation-enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: ${notification.dispatch.smtp-connect-timeout-ms:3000}
      mail.smtp.timeout: ${notification.dispatch.smtp-read-timeout-ms:5000}
      mail.smtp.writetimeout: ${notification.dispatch.smtp-write-timeout-ms:5000}

notification:
  mail:
    from: ${NOTIFICATION_MAIL_FROM:no-reply@my-microservice.local}
  dispatch:
    interval: ${NOTIFICATION_DISPATCH_INTERVAL:5s}
    batch-size: ${NOTIFICATION_DISPATCH_BATCH_SIZE:10}
    retry-delays: [10s, 30s, 1m, 2m, 5m, 10m, 30m, 1h]
    missing-recipient-max-attempts: 5
    smtp-connect-timeout-ms: 3000
    smtp-read-timeout-ms: 5000
    smtp-write-timeout-ms: 5000

app:
  events:
    schema: notification_service

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
