# 測試時停用排程：cron 每分鐘觸發，會改到其他測試的資料（例如把建立時間很早的 PENDING_PAYMENT 訂單取消）
# 排程的測試直接呼叫 run()，需要確認 cron 有註冊的測試自己用 @SpringBootTest(properties) 打開
# application.properties 的優先順序高於同位置的 application.yml
app.payment-timeout.cron=-
spring.kafka.listener.auto-startup=false
app.events.outbox-poll-interval=3600000
# 測試會連續呼叫排程的 run()：鎖至少持有的時間設成 0，否則第二次呼叫會被當成另一個副本的同一輪而略過（鎖的測試自己打開）
app.scheduling.lock.at-least-for=PT0S
