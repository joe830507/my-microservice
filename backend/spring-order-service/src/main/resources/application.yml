server:
  port: 8082

# 下游服務的位置：本機預設 localhost:{port}；K8s 部署時用環境變數改成 Service 名稱
order:
  services:
    product-uri: ${PRODUCT_SERVICE_URI:http://localhost:8081}
    inventory-uri: ${INVENTORY_SERVICE_URI:http://localhost:8083}
    connect-timeout: 2s
    # 建單時依序呼叫 product、inventory，最久約 2 × read-timeout
    read-timeout: 5s

spring:
  application:
    name: order-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      properties:
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 10000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  # 指標、追蹤、log 的共用設定（common 以外的 observability 模組，階段 A）
  config:
    import: classpath:observability.yml
  datasource:
    url: jdbc:postgresql://localhost:5433/order_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    schemas: order_service
  jackson:
    deserialization:
      # 數量必須是整數：預設會把 1.5 默默轉成 1
      accept-float-as-int: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
app:
  events:
    enabled: ${APP_EVENTS_ENABLED:true}
    schema: order_service
  # 排程的分散式鎖（ShedLock，階段 B4）：鎖放在自己的 PostgreSQL；
  # at-least-for 要大於副本之間的時鐘差、小於 cron 的間隔（這裡所有排程至少相隔 15 秒以上）
  scheduling:
    lock:
      table: order_service.shedlock
      at-most-for: PT5M
      at-least-for: PT10S
  # 每分鐘取消建立超過 30 分鐘仍未付款的訂單（PaymentTimeoutJob）
  # timeout 必須比 inventory 的預扣逾時（1 小時）短，否則付款時預扣可能已被釋放
  payment-timeout:
    cron: "0 * * * * *"
    timeout: 30m
    batch-size: 100
  # 每分鐘重試還沒成功通知 inventory 的釋放、確認（ReservationSyncJob）
  reservation-sync:
    cron: "30 * * * * *"
    min-age: 1m
    batch-size: 100

# API 文件（springdoc）：預設關閉（SEC-09）。Swagger UI 與 /v3/api-docs 會公開所有 API 的細節，只在本機開發用環境變數
# SPRINGDOC_ENABLED=true 開啟；Gateway 本來就不轉發這些路徑，所以對外也看不到
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
