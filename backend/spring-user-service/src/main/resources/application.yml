server:
  port: 8084

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5435/user_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    schemas: user_service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6380 # infra/docker-compose.yml 的 user-redis
      timeout: 500ms # 每個指令最多等多久；Redis 慢或掛掉時登入不會被拖住
      connect-timeout: 1s
jwt:
  private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:./secrets/jwt-private.pem}
  public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:./secrets/jwt-public.pem}
  key-id: user-service-2026-11
  issuer: user-service
  access-token-ttl: 15m
  refresh-token-ttl: 14d
  refresh-token-reuse-grace: 10s
app:
  # 每天 UTC 03:30 刪除過期超過 7 天的 refresh token（RefreshTokenCleanupJob）
  refresh-token-cleanup:
    cron: "0 30 3 * * *"
    retention: 7d
  # 同一個 email 在 window 內失敗 max-failures 次後，到 window 結束前一律回 429（LoginAttemptService）
  login-attempt:
    max-failures: 5
    window: 15m
